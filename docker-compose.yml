services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daad
      POSTGRES_PASSWORD: daad
      POSTGRES_DB: daad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
