[project]
name = "daad-search"
version = "0.1.0"
description = "Data foundation and hybrid retrieval pipeline for German study programs sourced from DAAD"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    # Explicit (not just via sqlalchemy's transitive marker, which lists
    # "aarch64" but not "arm64" — the value macOS Apple Silicon actually
    # reports, so `uv sync` silently skips it there without this line).
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "qdrant-client>=1.9",
    "voyageai>=0.2",
    "sentence-transformers>=3.0",
    "langchain-groq>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires docker compose services (Postgres/Qdrant) and/or live network and API keys",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
