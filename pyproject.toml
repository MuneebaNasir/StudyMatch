[project]
name = "daad-search"
version = "0.1.0"
description = "Data foundation and hybrid retrieval pipeline for German study programs sourced from DAAD"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    # Explicit (not just via sqlalchemy's transitive marker, which lists
    # "aarch64" but not "arm64" — the value macOS Apple Silicon actually
    # reports, so `uv sync` silently skips it there without this line).
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "qdrant-client>=1.9",
    "voyageai>=0.2",
    "sentence-transformers>=3.0",
    # Listed explicitly (not just pulled in transitively via
    # sentence-transformers) because [tool.uv.sources]'s index override below
    # is silently ignored for a package that's only a transitive dependency --
    # confirmed by isolated reproduction. Being a direct dependency is what
    # makes the pytorch-cpu source override actually apply.
    "torch",
    "langchain-groq>=0.2",
    "langchain-mistralai>=0.2",
    "langchain-google-genai>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires docker compose services (Postgres/Qdrant) and/or live network and API keys",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# The default PyPI wheel for Linux bundles CUDA runtime libraries (~900MB)
# that this project never uses -- embeddings run on CPU everywhere (see
# EMBEDDING_PROVIDER=local in config.py). The CPU-only index avoids
# shipping that dead weight in the Docker image.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
